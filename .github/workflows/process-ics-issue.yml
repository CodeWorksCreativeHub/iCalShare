name: Process Calendar Submission

on:
    issues:
        types: [opened, labeled]

jobs:
    process-calendar:
        # Prevents double execution when an issue is opened with initial labels
        if: |
            contains(github.event.issue.labels.*.name, 'calendar-submission') &&
            (github.event.action == 'opened' || github.event.label.name == 'calendar-submission')
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Process Issue Data
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      const issueBody = context.payload.issue.body || '';

                      // Helper function to extract content under a specific '### Header'
                      function getSection(label) {
                        const sections = issueBody.split(/^###\s+/m);
                        const match = sections.find(s => s.toLowerCase().startsWith(label.toLowerCase()));
                        if (!match) return '';

                        // Strip the header line and trim remaining text
                        const lines = match.split('\n');
                        lines.shift();
                        return lines.join('\n').trim();
                      }

                      // Parse parameters from template
                      const title = getSection('Calendar Title') || context.payload.issue.title.replace(/^New Calendar:\s*/i, '').trim();
                      const category = getSection('Category') || 'General';
                      const description = getSection('Description') || 'No description provided.';

                      // Extract ICS content block
                      let rawIcs = getSection('ICS Content');

                      // Clean out Markdown codeblock wrappers (```ics ... ```)
                      rawIcs = rawIcs.replace(/^```[a-z]*\r?\n?/i, '').replace(/\r?\n?```$/i, '').trim();

                      if (!rawIcs || !rawIcs.includes('BEGIN:VCALENDAR')) {
                        core.setFailed('Invalid ICS content provided in issue body.');

                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.payload.issue.number,
                          body: '❌ **Submission Failed:** Valid `.ics` calendar content (`BEGIN:VCALENDAR`) was not found in the issue body.'
                        });
                        return;
                      }

                      // Generate clean file IDs & directories
                      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || `calendar-${context.payload.issue.number}`;
                      const categoryDir = category.toLowerCase().replace(/[^a-z0-9]+/g, '') || 'general';
                      const targetFolder = path.join(process.cwd(), 'calendars', categoryDir);
                      const targetIcsPath = path.join(targetFolder, `${slug}.ics`);
                      const relativeFilePath = `calendars/${categoryDir}/${slug}.ics`;

                      // Ensure destination directory exists
                      fs.mkdirSync(targetFolder, { recursive: true });

                      // Save .ics file content
                      fs.writeFileSync(targetIcsPath, rawIcs, 'utf8');

                      // Update calendars.json database
                      const jsonPath = path.join(process.cwd(), 'calendars.json');
                      let db = [];
                      if (fs.existsSync(jsonPath)) {
                        try {
                          db = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
                        } catch (e) {
                          db = [];
                        }
                      }

                      // Upsert entry in JSON
                      const existingIndex = db.findIndex(item => item.id === slug);
                      const entry = {
                        id: slug,
                        title: title,
                        category: category,
                        description: description,
                        file: relativeFilePath
                      };

                      if (existingIndex >= 0) {
                        db[existingIndex] = entry;
                      } else {
                        db.push(entry);
                      }

                      fs.writeFileSync(jsonPath, JSON.stringify(db, null, 2), 'utf8');

                      // Post success comment
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.issue.number,
                        body: `🎉 **Calendar Published Successfully!**\n\n- **Title:** ${title}\n- **Category:** ${category}\n- **Path:** \`${relativeFilePath}\`\n\nYour submission is now live in the repository database!`
                      });

                      // Close Issue automatically
                      await github.rest.issues.update({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.issue.number,
                        state: 'closed'
                      });

            - name: Commit & Push Changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add calendars/ calendars.json
                  git commit -m "feat: auto-add calendar from Issue #${{ github.event.issue.number }}" || echo "No changes to commit"
                  git push