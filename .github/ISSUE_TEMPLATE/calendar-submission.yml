name: "Calendar Submission"
description: "Submit a new .ics calendar to the directory"
title: "[Calendar Submission]: "
labels: ["calendar-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a calendar! Please ensure your `.ics` content is valid calendar data.

  - type: input
    id: calendar_title
    attributes:
      label: "Calendar Title"
      description: "The display name for this calendar."
      placeholder: "e.g. Formula 1 2026 Season"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      description: "Select the category that best fits this calendar."
      options:
        - "Holidays"
        - "Sports"
        - "TV & Movies"
        - "Tech"
        - "General"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A short summary of what events this calendar contains."
      placeholder: "Key event dates for..."
    validations:
      required: true

  - type: textarea
    id: ics_content
    attributes:
      label: "ICS Content"
      description: "Paste raw VCALENDAR / .ics text data here."
      render: ics
    validations:
      required: true